<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            padding: 50px;
        }
        .app-icon {
            width: 150px;
            height: auto;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2em;
            color: #333;
        }
        p {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 30px;
        }
        .download-links {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .download-links a {
            display: inline-block;
            padding: 15px 30px;
            font-size: 1.2em;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        .google-play {
            background-color: #34a853;
        }
        .google-play:hover {
            background-color: #2b8a43;
        }
        .app-store {
            background-color: #007aff;
        }
        .app-store:hover {
            background-color: #005dbb;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="Icon-App-1024x1024@1x.png" alt="App Icon" class="app-icon">
        <h1>Download Our App</h1>
        <p>Get our app on your favorite platform and enjoy our services today!</p>
        <div class="download-links">
            <a href="https://play.google.com/store/apps/details?id=com.greentouch.letsgo" class="google-play" target="_blank">Get it on Google Play</a>
            <a href="https://testflight.apple.com/join/NPyBzUDK" class="app-store" target="_blank">Download on the App Store</a>
        </div>
    </div>
</body>
</html>
